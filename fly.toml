# Keep app and PUBLIC_ORIGIN in sync when deploying a separate copy.
app = "customer-service-order-agent-demo"
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8787"
  DEMO_AUTH_REQUIRED = "true"
  DEMO_USERNAME = "demo"
  REFUND_AUTO_APPROVE_MAX = "500"
  DEMO_ORDER_STORE_DOMAIN = "nate-ce.myshopify.com"
  PUBLIC_ORIGIN = "https://customer-service-order-agent-demo.fly.dev"
  SHOPIFY_ACTIONS_DB = "/data/shopify-actions.sqlite"
  HUMAN_SUPPORT_DB = "/data/human-support.sqlite"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

  [http_service.http_options]
    idle_timeout = 120

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "demo_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 7

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
